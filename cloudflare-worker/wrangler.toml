name = "sentinelx-api-gateway"
main = "src/index.ts"
compatibility_date = "2026-10-30"

[observability]
enabled = true

[vars]
ALLOWED_ORIGIN = "https://sentinelx-api-gateway.aiman132046.workers.dev"

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[ratelimits]]
name = "LOGIN_RATE_LIMITER"
namespace_id = "73104"

  [ratelimits.simple]
  limit = 5
  period = 60

[[kv_namespaces]]
binding = "INTEGRATION_CONFIGS"
id = "11b0f6bc1a374810b010978efcf11359"

[[d1_databases]]
binding = "DB"
database_name = "sentinelx-auth-users"
database_id = "5d1561a8-8e32-475d-b45e-67a0424b44f2"
migrations_dir = "migrations"

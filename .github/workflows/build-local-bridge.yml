name: Build SentinelX Local Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - feat/cross-platform-local-bridge
    paths:
      - "bridge/**"
      - ".github/workflows/build-local-bridge.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: windows
            arch: amd64
            suffix: windows-amd64.exe
          - os: linux
            arch: amd64
            suffix: linux-amd64
          - os: linux
            arch: arm64
            suffix: linux-arm64
          - os: darwin
            arch: amd64
            suffix: macos-amd64
          - os: darwin
            arch: arm64
            suffix: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Build
        working-directory: bridge
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o sentinelx-bridge-${{ matrix.suffix }} .
      - uses: actions/upload-artifact@v4
        with:
          name: sentinelx-bridge-${{ matrix.suffix }}
          path: bridge/sentinelx-bridge-${{ matrix.suffix }}
          if-no-files-found: error

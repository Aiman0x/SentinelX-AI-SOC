name: Deploy SentinelX API Gateway

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare-worker/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinelx-api-gateway
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: sentinelx-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy SentinelX API Gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN as a GitHub Actions secret."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_ACCOUNT_ID as a GitHub Actions variable."
            exit 1
          fi
          npx --yes wrangler@4 deploy --config cloudflare-worker/wrangler.toml

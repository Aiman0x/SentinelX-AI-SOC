name: Deploy SentinelX to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "cloudflare-worker/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.*"
      - "tsconfig*.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentinelx-cloudflare-workers
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: sentinelx-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build SentinelX GUI for Workers
        env:
          VITE_API_BASE_URL: https://sentinelx-api-gateway.aiman132046.workers.dev
          VITE_ENVIRONMENT_LABEL: SENTINELX PRODUCTION
        run: npm run build

      - name: Deploy GUI assets and API gateway
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f3d939d4d22c2ce55786566917f3f15b
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN as a GitHub Actions secret."
            exit 1
          fi
          npx --yes wrangler@4 deploy --config cloudflare-worker/wrangler.toml
